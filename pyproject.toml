# UE5RL Engine —— Python (external training) side
#
# 说明：本pyproject 管理"外部训练进程"侧的 Python 环境（适配器 + RSL-RL）。
# UE Worker（C++）不在此管理。references/ 只保存外部实现源码快照，运行时依赖
# 必须从包索引解析，不能从 references/ 目录安装。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-rl-engine"
version = "1.0.0"
description = "UE RL Engine：在 UE5 Chaos 中训练机器人策略，并部署进游戏。"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # RSL-RL runtime package；references/rsl_rl 仅供源码参考，不是安装源。
    "rsl-rl-lib==5.4.2",
    # Keep the project environment on the CUDA 12.8 wheels used by the RTX 4060 host.
    # These are explicit project dependencies so uv cannot resolve the transitive
    # RSL-RL torch requirements back to the default PyPI build.
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.6.0",
    "pillow>=11.2.0",
    # 资产同目录 RobotConfig 文本文件解析（spec D12）：仅用 yaml.safe_load。
    "pyyaml>=6.0",
]

[project.scripts]
uerl = "uerl.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pre-commit>=3.8",
    "onnxruntime>=1.29.0",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# 代码规范；项目约束入口见 AGENTS.md。
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = ["src", "."]

[tool.pyright]
extraPaths = ["src", "."]
executionEnvironments = [{ root = ".", extraPaths = ["src", "."] }]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "."]
executionEnvironments = [{ root = ".", extraPaths = ["src", "."] }]

[tool.pytest.ini_options]
testpaths = [
    "tests/python/unit",
    "tests/python/integration",
    "tests/protocol/unit",
    "tests/protocol/integration",
    "tests/tooling",
    "tests/parity",
]
pythonpath = ["src", "."]
