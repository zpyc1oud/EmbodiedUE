# UE RL Engine — Python training environment
#
# This file manages the external Python trainer, adapters, and RSL-RL.
# Build the C++ UE Worker separately. Local references/ snapshots are not
# runtime installation sources; resolve dependencies from package indexes.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-rl-engine"
version = "1.0.0"
description = "Early-stage tools to train robot policies in Unreal Engine Chaos and deploy them in games."
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # RSL-RL runtime dependency; references/rsl_rl is for source inspection only.
    "rsl-rl-lib==5.4.2",
    # Keep the project environment on the CUDA 12.8 wheels used by the RTX 4060 host.
    # These are explicit project dependencies so uv cannot resolve the transitive
    # RSL-RL torch requirements back to the default PyPI build.
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.6.0",
    "pillow>=11.2.0",
    # Parse RobotConfig text with yaml.safe_load.
    "pyyaml>=6.0",
]

[project.scripts]
uerl = "uerl.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pre-commit>=3.8",
    "onnxruntime>=1.29.0",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"uerl.configs" = ["**/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

# Code conventions and project constraints: see AGENTS.md.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = ["src", "."]

[tool.pyright]
extraPaths = ["src", "."]
executionEnvironments = [{ root = ".", extraPaths = ["src", "."] }]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "."]
executionEnvironments = [{ root = ".", extraPaths = ["src", "."] }]

[tool.pytest.ini_options]
testpaths = [
    "tests/python/unit",
    "tests/python/integration",
    "tests/protocol/unit",
    "tests/protocol/integration",
    "tests/tooling",
    "tests/parity",
]
pythonpath = ["src", "."]
