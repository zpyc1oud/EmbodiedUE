num_levels: 8
cell_size: [30.0, 10.0]
# Each level uses Isaac Lab random_uniform_terrain semantics: deterministic
# quantised heights on a coarse lattice are interpolated onto the final
# heightfield grid. Local uphill and downhill sections occur naturally;
# amplitude and spatial frequency increase with the level. The final level is
# capped at +/-0.12 m, below the observed settled PhantomX body height of about
# 0.129 m. The generated border fades the surface back to zero so adjacent
# Slot maps do not form cliffs.
border_width: 4.0
tiers:
  - level: 0
    primitive: heightfield
    seed: "20260824"
    platform_width: 0.8
    params:
      noise_range: [-0.015, 0.015]
      noise_step: 0.005
      horizontal_scale: 0.4
      vertical_scale: 0.005
      downsampled_scale: 0.90
